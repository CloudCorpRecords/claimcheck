name: Registry edit (one-off)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: PUT corrected server.json over the existing version
        run: |
          set -euo pipefail
          echo "Files mcp-publisher may have written:"
          find "$HOME" -maxdepth 4 \( -iname "*mcp*publisher*" -o -iname ".mcpregistry*" -o -iname "*registry*token*" \) 2>/dev/null | head -20
          TOKEN=$(python3 - <<'PYEOF'
          import glob, json, os
          candidates = []
          for pat in ["~/.mcp_publisher_token", "~/.config/mcp-publisher/*", "~/.mcpregistry_*", "~/.*token*"]:
              candidates += glob.glob(os.path.expanduser(pat))
          for path in candidates:
              try:
                  with open(path) as f:
                      data = json.load(f)
                  tok = data.get("token") or data.get("registry_token")
                  if tok:
                      print(tok)
                      break
              except Exception:
                  continue
          else:
              raise SystemExit("registry token file not found in: " + ", ".join(candidates))
          PYEOF
          )
          NAME=$(python3 -c "import json,urllib.parse; print(urllib.parse.quote(json.load(open('server.json'))['name'], safe=''))")
          VER=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          echo "Editing $NAME version $VER"
          curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @server.json \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$VER" | tee put-result.json
          python3 - <<'EOF'
          import json
          d = json.load(open('put-result.json'))
          assert 'server' in d, f"PUT did not return a server record: {d}"
          pkgs = d['server']['packages']
          print('registry now serves version', d['server']['version'], 'packages:', [(p.get('registryType'), p.get('identifier'), p.get('version')) for p in pkgs])
          EOF
