# Greenlight Guard: one comment on every pull request, updated on pushes.
name: Greenlight Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guard the PR
        uses: CloudCorpRecords/greenlight@be5360745d55bacd77350701f043d641918e1738 # v0.3.10
        id: guard
      - name: Fail the check when the guard flags something
        if: steps.guard.outputs.findings != '0'
        run: |
          echo "::warning::greenlight guard flagged ${{ steps.guard.outputs.findings }} things; see the guard comment on this PR"
